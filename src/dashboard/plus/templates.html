<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAHA Plus — Templates</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2316a34a'/><path d='M72 28H28a6 6 0 0 0-6 6v34l12-12h38a6 6 0 0 0 6-6V34a6 6 0 0 0-6-6z' fill='white'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #080c0a; color: #e2e8e0; min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(34,197,94,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(34,197,94,0.03) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none;
    }
    .nav { background: rgba(12,20,15,0.95); border-bottom: 1px solid rgba(34,197,94,0.15); padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 56px; position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-size: 18px; font-weight: 700; color: #22c55e; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .nav-sep { color: rgba(34,197,94,0.3); }
    .nav-title { font-size: 14px; color: #86efac; }
    .nav-back { margin-left: auto; font-size: 13px; color: #86efac; text-decoration: none; padding: 6px 14px; border: 1px solid rgba(34,197,94,0.3); border-radius: 6px; }
    .nav-back:hover { background: rgba(34,197,94,0.1); }
    .container { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
    h1 { font-size: 24px; font-weight: 700; color: #f0fdf4; margin-bottom: 4px; }
    .subtitle { color: #86efac; font-size: 14px; margin-bottom: 32px; }
    .card { background: rgba(12,20,15,0.8); border: 1px solid rgba(34,197,94,0.15); border-radius: 16px; padding: 28px; margin-bottom: 28px; }
    .card-title { font-size: 16px; font-weight: 600; color: #f0fdf4; margin-bottom: 20px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 12px; color: #86efac; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    input, select, textarea { background: rgba(8,12,10,0.8); border: 1px solid rgba(34,197,94,0.2); border-radius: 8px; color: #e2e8e0; padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: rgba(34,197,94,0.5); }
    textarea { resize: vertical; min-height: 80px; }
    select option { background: #0d1f14; }
    .btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: #16a34a; color: white; }
    .btn-primary:hover { background: #15803d; }
    .btn-sm { font-size: 12px; padding: 5px 12px; }
    .btn-outline { background: transparent; color: #86efac; border: 1px solid rgba(34,197,94,0.3); }
    .btn-outline:hover { background: rgba(34,197,94,0.1); }
    .btn-danger { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    .btn-send { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .btn-send:hover { background: rgba(34,197,94,0.25); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(134,239,172,0.6); border-bottom: 1px solid rgba(34,197,94,0.1); }
    td { padding: 12px; border-bottom: 1px solid rgba(34,197,94,0.07); vertical-align: middle; }
    tr:hover td { background: rgba(34,197,94,0.03); }
    .mono { font-family: 'DM Mono', monospace; font-size: 12px; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; background: rgba(34,197,94,0.1); color: #86efac; border: 1px solid rgba(34,197,94,0.2); margin: 2px; }
    .actions { display: flex; gap: 6px; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: #0d1f14; border: 1px solid rgba(34,197,94,0.3); border-radius: 16px; padding: 32px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 18px; font-weight: 700; color: #f0fdf4; margin-bottom: 20px; }
    .modal-footer { display: flex; gap: 12px; margin-top: 20px; justify-content: flex-end; }
    .empty { text-align: center; padding: 40px; color: rgba(134,239,172,0.4); font-size: 14px; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #16a34a; color: white; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }
    .toast.show { opacity: 1; }
    .toast.error { background: #dc2626; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/dashboard" class="nav-logo">
      <svg width="24" height="24" viewBox="0 0 100 100" fill="none"><rect width="100" height="100" rx="20" fill="#16a34a"/><path d="M72 28H28a6 6 0 0 0-6 6v34l12-12h38a6 6 0 0 0 6-6V34a6 6 0 0 0-6-6z" fill="white"/></svg>
      WAHA
    </a>
    <span class="nav-sep">/</span>
    <span class="nav-title">📋 Templates</span>
    <a href="/dashboard/plus/" class="nav-back">← Plus Hub</a>
  </nav>

  <div class="container">
    <h1>📋 Message Templates</h1>
    <p class="subtitle">Create and manage reusable message templates</p>

    <div class="card">
      <div class="card-title">✨ Create Template</div>
      <form id="createForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="f-name" placeholder="welcome-message" required />
          </div>
          <div class="form-group">
            <label>Type</label>
            <select id="f-type">
              <option value="text">Text</option>
              <option value="image">Image</option>
              <option value="file">File</option>
              <option value="video">Video</option>
              <option value="voice">Voice</option>
            </select>
          </div>
          <div class="form-group full">
            <label>Tags (comma separated)</label>
            <input type="text" id="f-tags" placeholder="onboarding, marketing" />
          </div>
          <div class="form-group full">
            <label>Payload (JSON)</label>
            <textarea id="f-payload" placeholder='{"text": "Hello!"}'>{&quot;text&quot;: &quot;Hello!&quot;}</textarea>
          </div>
        </div>
        <div style="margin-top:16px;">
          <button type="submit" class="btn btn-primary">Create Template</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="card-title">📋 Templates</div>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Tags</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="templatesTable">
          <tr><td colspan="5" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Send Modal -->
  <div class="modal-overlay" id="sendModal">
    <div class="modal">
      <div class="modal-title">🚀 Send Template</div>
      <input type="hidden" id="send-tmpl-id" />
      <div class="form-group" style="margin-bottom:16px;">
        <label>Session</label>
        <input type="text" id="send-session" placeholder="default" />
      </div>
      <div class="form-group" style="margin-bottom:16px;">
        <label>Chat ID</label>
        <input type="text" id="send-chatId" placeholder="11111111111@c.us" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeSendModal()">Cancel</button>
        <button class="btn btn-primary" onclick="doSend()">Send</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let apiKey = '';

    async function loadApiKey() {
      try {
        const r = await fetch('/api/dashboard/config');
        const d = await r.json();
        apiKey = d.apiKey || '';
      } catch {}
    }

    function headers(isJson = true) {
      const h = { 'Authorization': `Bearer ${apiKey}` };
      if (isJson) h['Content-Type'] = 'application/json';
      return h;
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => t.className = 'toast', 3000);
    }

    function fmtDate(ts) { return new Date(ts).toLocaleDateString(); }

    async function loadTemplates() {
      try {
        const r = await fetch('/api/templates', { headers: headers(false) });
        const list = await r.json();
        const tbody = document.getElementById('templatesTable');
        if (!Array.isArray(list) || list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty">No templates yet</td></tr>';
          return;
        }
        tbody.innerHTML = list.map(t => `
          <tr>
            <td><strong>${t.name}</strong></td>
            <td>${t.type}</td>
            <td>${(t.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('')}</td>
            <td>${fmtDate(t.createdAt)}</td>
            <td>
              <div class="actions">
                <button class="btn btn-sm btn-send" onclick="openSendModal('${t.id}')">Send</button>
                <button class="btn btn-sm btn-danger" onclick="deleteTemplate('${t.id}')">Delete</button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch {
        document.getElementById('templatesTable').innerHTML = '<tr><td colspan="5" class="empty">Error loading templates</td></tr>';
      }
    }

    async function deleteTemplate(id) {
      if (!confirm('Delete this template?')) return;
      try {
        await fetch(`/api/templates/${id}`, { method: 'DELETE', headers: headers(false) });
        showToast('Template deleted');
        loadTemplates();
      } catch { showToast('Failed to delete', true); }
    }

    function openSendModal(id) {
      document.getElementById('send-tmpl-id').value = id;
      document.getElementById('sendModal').classList.add('show');
    }

    function closeSendModal() {
      document.getElementById('sendModal').classList.remove('show');
    }

    async function doSend() {
      const id = document.getElementById('send-tmpl-id').value;
      const session = document.getElementById('send-session').value.trim();
      const chatId = document.getElementById('send-chatId').value.trim();
      if (!session || !chatId) { showToast('Session and chatId required', true); return; }
      try {
        const r = await fetch(`/api/templates/${id}/send`, {
          method: 'POST', headers: headers(), body: JSON.stringify({ session, chatId })
        });
        if (r.ok) { showToast('Template sent!'); closeSendModal(); }
        else { const d = await r.json(); showToast(d.message || 'Failed', true); }
      } catch { showToast('Error sending template', true); }
    }

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      let payload;
      try { payload = JSON.parse(document.getElementById('f-payload').value); }
      catch { showToast('Invalid JSON payload', true); return; }

      const tagsRaw = document.getElementById('f-tags').value.trim();
      const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : [];

      const body = {
        name: document.getElementById('f-name').value.trim(),
        type: document.getElementById('f-type').value,
        payload,
        tags,
      };

      try {
        const r = await fetch('/api/templates', { method: 'POST', headers: headers(), body: JSON.stringify(body) });
        if (r.ok) { showToast('Template created!'); loadTemplates(); e.target.reset(); }
        else { const d = await r.json(); showToast(d.message || 'Failed', true); }
      } catch { showToast('Error creating template', true); }
    });

    document.getElementById('sendModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeSendModal();
    });

    loadApiKey().then(loadTemplates);
  </script>
</body>
</html>
