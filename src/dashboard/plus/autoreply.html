<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAHA Plus — Auto-Reply</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2316a34a'/><path d='M72 28H28a6 6 0 0 0-6 6v34l12-12h38a6 6 0 0 0 6-6V34a6 6 0 0 0-6-6z' fill='white'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #080c0a; color: #e2e8e0; min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(34,197,94,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(34,197,94,0.03) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none;
    }
    .nav { background: rgba(12,20,15,0.95); border-bottom: 1px solid rgba(34,197,94,0.15); padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 56px; position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-size: 18px; font-weight: 700; color: #22c55e; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .nav-sep { color: rgba(34,197,94,0.3); }
    .nav-title { font-size: 14px; color: #86efac; }
    .nav-back { margin-left: auto; font-size: 13px; color: #86efac; text-decoration: none; padding: 6px 14px; border: 1px solid rgba(34,197,94,0.3); border-radius: 6px; }
    .nav-back:hover { background: rgba(34,197,94,0.1); }
    .container { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
    h1 { font-size: 24px; font-weight: 700; color: #f0fdf4; margin-bottom: 4px; }
    .subtitle { color: #86efac; font-size: 14px; margin-bottom: 32px; }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .card { background: rgba(12,20,15,0.8); border: 1px solid rgba(34,197,94,0.15); border-radius: 16px; padding: 28px; margin-bottom: 28px; }
    .card-title { font-size: 16px; font-weight: 600; color: #f0fdf4; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    label { font-size: 12px; color: #86efac; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    input, select, textarea { background: rgba(8,12,10,0.8); border: 1px solid rgba(34,197,94,0.2); border-radius: 8px; color: #e2e8e0; padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s; width: 100%; }
    input:focus, select:focus, textarea:focus { border-color: rgba(34,197,94,0.5); }
    textarea { resize: vertical; min-height: 70px; }
    select option { background: #0d1f14; }
    .btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: #16a34a; color: white; }
    .btn-primary:hover { background: #15803d; }
    .btn-sm { font-size: 12px; padding: 5px 12px; }
    .btn-outline { background: transparent; color: #86efac; border: 1px solid rgba(34,197,94,0.3); }
    .btn-outline:hover { background: rgba(34,197,94,0.1); }
    .btn-danger { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(134,239,172,0.6); border-bottom: 1px solid rgba(34,197,94,0.1); }
    td { padding: 10px 12px; border-bottom: 1px solid rgba(34,197,94,0.07); vertical-align: middle; }
    tr:hover td { background: rgba(34,197,94,0.03); }
    .mono { font-family: 'DM Mono', monospace; font-size: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-active { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .badge-inactive { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.3); }
    .badge-match { background: rgba(34,197,94,0.1); color: #86efac; border: 1px solid rgba(34,197,94,0.2); font-size: 11px; padding: 2px 8px; border-radius: 4px; }
    .test-result { margin-top: 16px; padding: 16px; background: rgba(8,12,10,0.8); border: 1px solid rgba(34,197,94,0.15); border-radius: 8px; font-size: 13px; }
    .test-match { color: #4ade80; margin-bottom: 8px; }
    .test-rule { padding: 8px 12px; background: rgba(34,197,94,0.05); border-radius: 6px; margin-bottom: 6px; }
    .test-rule strong { color: #86efac; }
    .test-none { color: rgba(134,239,172,0.5); font-style: italic; }
    .actions { display: flex; gap: 6px; }
    .toggle-btn { background: transparent; border: 1px solid rgba(34,197,94,0.3); color: #86efac; font-size: 11px; padding: 3px 10px; border-radius: 20px; cursor: pointer; }
    .toggle-btn:hover { background: rgba(34,197,94,0.1); }
    .empty { text-align: center; padding: 40px; color: rgba(134,239,172,0.4); font-size: 14px; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #16a34a; color: white; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }
    .toast.show { opacity: 1; }
    .toast.error { background: #dc2626; }
    @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/dashboard" class="nav-logo">
      <svg width="24" height="24" viewBox="0 0 100 100" fill="none"><rect width="100" height="100" rx="20" fill="#16a34a"/><path d="M72 28H28a6 6 0 0 0-6 6v34l12-12h38a6 6 0 0 0 6-6V34a6 6 0 0 0-6-6z" fill="white"/></svg>
      WAHA
    </a>
    <span class="nav-sep">/</span>
    <span class="nav-title">🤖 Auto-Reply</span>
    <a href="/dashboard/plus/" class="nav-back">← Plus Hub</a>
  </nav>

  <div class="container">
    <h1>🤖 Auto-Reply Rules</h1>
    <p class="subtitle">Automatically reply to incoming messages based on keyword matching</p>

    <div class="layout">
      <div>
        <div class="card">
          <div class="card-title">✨ Create Rule</div>
          <form id="createForm">
            <div class="form-group">
              <label>Session</label>
              <input type="text" id="f-session" placeholder="default" required />
            </div>
            <div class="form-group">
              <label>Keyword</label>
              <input type="text" id="f-keyword" placeholder="hello" required />
            </div>
            <div class="form-group">
              <label>Match Type</label>
              <select id="f-matchType">
                <option value="contains">Contains</option>
                <option value="exact">Exact match</option>
                <option value="startsWith">Starts with</option>
                <option value="regex">Regex</option>
              </select>
            </div>
            <div class="form-group">
              <label>Reply Text</label>
              <textarea id="f-replyText" placeholder="Hi there! How can I help you?" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Create Rule</button>
          </form>
        </div>

        <div class="card">
          <div class="card-title">🧪 Test Rules</div>
          <div class="form-group">
            <label>Session</label>
            <input type="text" id="t-session" placeholder="default" />
          </div>
          <div class="form-group">
            <label>Test Message</label>
            <input type="text" id="t-text" placeholder="hello world" />
          </div>
          <button class="btn btn-outline" style="width:100%" onclick="testRules()">Test</button>
          <div id="test-result" style="display:none" class="test-result"></div>
        </div>
      </div>

      <div>
        <div class="card" style="padding: 20px;">
          <div class="card-title">📋 Rules</div>
          <div style="margin-bottom:12px;">
            <input type="text" id="filter-session" placeholder="Filter by session..." style="font-size:13px; padding:8px 12px;" oninput="loadRules()" />
          </div>
          <table>
            <thead>
              <tr>
                <th>Session</th>
                <th>Keyword</th>
                <th>Match</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="rulesTable">
              <tr><td colspan="5" class="empty">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let apiKey = '';

    async function loadApiKey() {
      try {
        const r = await fetch('/api/dashboard/config');
        const d = await r.json();
        apiKey = d.apiKey || '';
      } catch {}
    }

    function headers(isJson = true) {
      const h = { 'Authorization': `Bearer ${apiKey}` };
      if (isJson) h['Content-Type'] = 'application/json';
      return h;
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => t.className = 'toast', 3000);
    }

    async function loadRules() {
      const filterSession = document.getElementById('filter-session').value.trim();
      let url = '/api/autoreply';
      if (filterSession) url += `?session=${encodeURIComponent(filterSession)}`;
      try {
        const r = await fetch(url, { headers: headers(false) });
        const rules = await r.json();
        const tbody = document.getElementById('rulesTable');
        if (!Array.isArray(rules) || rules.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty">No rules yet</td></tr>';
          return;
        }
        tbody.innerHTML = rules.map(rule => `
          <tr>
            <td>${rule.session}</td>
            <td class="mono">${rule.keyword}</td>
            <td><span class="badge-match">${rule.matchType}</span></td>
            <td><span class="badge ${rule.isActive ? 'badge-active' : 'badge-inactive'}">${rule.isActive ? 'active' : 'inactive'}</span></td>
            <td>
              <div class="actions">
                <button class="toggle-btn" onclick="toggleRule('${rule.id}', ${rule.isActive})">${rule.isActive ? 'Disable' : 'Enable'}</button>
                <button class="btn btn-sm btn-danger" onclick="deleteRule('${rule.id}')">Del</button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch {
        document.getElementById('rulesTable').innerHTML = '<tr><td colspan="5" class="empty">Error loading rules</td></tr>';
      }
    }

    async function toggleRule(id, isActive) {
      try {
        await fetch(`/api/autoreply/${id}`, {
          method: 'PUT', headers: headers(), body: JSON.stringify({ isActive: !isActive })
        });
        showToast(isActive ? 'Rule disabled' : 'Rule enabled');
        loadRules();
      } catch { showToast('Failed to update rule', true); }
    }

    async function deleteRule(id) {
      if (!confirm('Delete this rule?')) return;
      try {
        await fetch(`/api/autoreply/${id}`, { method: 'DELETE', headers: headers(false) });
        showToast('Rule deleted');
        loadRules();
      } catch { showToast('Failed to delete', true); }
    }

    async function testRules() {
      const session = document.getElementById('t-session').value.trim();
      const text = document.getElementById('t-text').value.trim();
      if (!session || !text) { showToast('Session and text required', true); return; }

      try {
        const r = await fetch('/api/autoreply/test', {
          method: 'POST', headers: headers(), body: JSON.stringify({ session, text })
        });
        const result = await r.json();
        const div = document.getElementById('test-result');
        div.style.display = 'block';
        if (result.matchCount === 0) {
          div.innerHTML = '<div class="test-none">No matching rules for this message.</div>';
        } else {
          div.innerHTML = `
            <div class="test-match">${result.matchCount} rule(s) matched:</div>
            ${result.matchingRules.map(rule => `
              <div class="test-rule">
                <strong>${rule.keyword}</strong> (${rule.matchType})<br/>
                <span style="color:#e2e8e0; margin-top:4px; display:block;">"${rule.replyText}"</span>
              </div>
            `).join('')}
          `;
        }
      } catch { showToast('Error testing rules', true); }
    }

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        session: document.getElementById('f-session').value.trim(),
        keyword: document.getElementById('f-keyword').value.trim(),
        matchType: document.getElementById('f-matchType').value,
        replyText: document.getElementById('f-replyText').value.trim(),
        isActive: true,
      };
      try {
        const r = await fetch('/api/autoreply', { method: 'POST', headers: headers(), body: JSON.stringify(body) });
        if (r.ok) { showToast('Rule created!'); loadRules(); e.target.reset(); }
        else { const d = await r.json(); showToast(d.message || 'Failed', true); }
      } catch { showToast('Error creating rule', true); }
    });

    loadApiKey().then(loadRules);
  </script>
</body>
</html>
