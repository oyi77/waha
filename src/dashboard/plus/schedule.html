<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAHA Plus — Scheduling</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2316a34a'/><path d='M72 28H28a6 6 0 0 0-6 6v34l12-12h38a6 6 0 0 0 6-6V34a6 6 0 0 0-6-6z' fill='white'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #080c0a; color: #e2e8e0; min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(34,197,94,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(34,197,94,0.03) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none;
    }
    .nav { background: rgba(12,20,15,0.95); border-bottom: 1px solid rgba(34,197,94,0.15); padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 56px; position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-size: 18px; font-weight: 700; color: #22c55e; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .nav-sep { color: rgba(34,197,94,0.3); }
    .nav-title { font-size: 14px; color: #86efac; }
    .nav-back { margin-left: auto; font-size: 13px; color: #86efac; text-decoration: none; padding: 6px 14px; border: 1px solid rgba(34,197,94,0.3); border-radius: 6px; }
    .nav-back:hover { background: rgba(34,197,94,0.1); }
    .container { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
    h1 { font-size: 24px; font-weight: 700; color: #f0fdf4; margin-bottom: 4px; }
    .subtitle { color: #86efac; font-size: 14px; margin-bottom: 32px; }
    .card { background: rgba(12,20,15,0.8); border: 1px solid rgba(34,197,94,0.15); border-radius: 16px; padding: 28px; margin-bottom: 28px; }
    .card-title { font-size: 16px; font-weight: 600; color: #f0fdf4; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 12px; color: #86efac; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    input, select, textarea { background: rgba(8,12,10,0.8); border: 1px solid rgba(34,197,94,0.2); border-radius: 8px; color: #e2e8e0; padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: rgba(34,197,94,0.5); }
    input[type="datetime-local"] { color-scheme: dark; }
    textarea { resize: vertical; min-height: 80px; }
    select option { background: #0d1f14; }
    .btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: #16a34a; color: white; }
    .btn-primary:hover { background: #15803d; }
    .btn-danger { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); font-size: 12px; padding: 5px 12px; }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    .refresh-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .refresh-info { font-size: 12px; color: rgba(134,239,172,0.5); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(134,239,172,0.6); border-bottom: 1px solid rgba(34,197,94,0.1); }
    td { padding: 12px; border-bottom: 1px solid rgba(34,197,94,0.07); vertical-align: top; }
    tr:hover td { background: rgba(34,197,94,0.03); }
    .mono { font-family: 'DM Mono', monospace; font-size: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-pending { background: rgba(234,179,8,0.15); color: #facc15; border: 1px solid rgba(234,179,8,0.3); }
    .badge-sent { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .badge-failed { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .badge-cancelled { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.3); }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #16a34a; color: white; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000; }
    .toast.show { opacity: 1; }
    .toast.error { background: #dc2626; }
    .empty { text-align: center; padding: 40px; color: rgba(134,239,172,0.4); font-size: 14px; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/dashboard" class="nav-logo">
      <svg width="24" height="24" viewBox="0 0 100 100" fill="none"><rect width="100" height="100" rx="20" fill="#16a34a"/><path d="M72 28H28a6 6 0 0 0-6 6v34l12-12h38a6 6 0 0 0 6-6V34a6 6 0 0 0-6-6z" fill="white"/></svg>
      WAHA
    </a>
    <span class="nav-sep">/</span>
    <span class="nav-title">⏰ Scheduling</span>
    <a href="/dashboard/plus/" class="nav-back">← Plus Hub</a>
  </nav>

  <div class="container">
    <h1>⏰ Message Scheduling</h1>
    <p class="subtitle">Schedule messages to be sent at a specific date and time</p>

    <div class="card">
      <div class="card-title">📝 Schedule a Message</div>
      <form id="scheduleForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Session</label>
            <input type="text" id="f-session" placeholder="default" required />
          </div>
          <div class="form-group">
            <label>Chat ID</label>
            <input type="text" id="f-chatId" placeholder="11111111111@c.us" required />
          </div>
          <div class="form-group">
            <label>Type</label>
            <select id="f-type">
              <option value="text">Text</option>
              <option value="image">Image</option>
              <option value="file">File</option>
              <option value="video">Video</option>
              <option value="voice">Voice</option>
            </select>
          </div>
          <div class="form-group">
            <label>Scheduled At</label>
            <input type="datetime-local" id="f-scheduledAt" required />
          </div>
          <div class="form-group full">
            <label>Payload (JSON)</label>
            <textarea id="f-payload" placeholder='{"text": "Hello!"}'>{&quot;text&quot;: &quot;Hello!&quot;}</textarea>
          </div>
        </div>
        <div style="margin-top:16px;">
          <button type="submit" class="btn btn-primary">Schedule Message</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="refresh-row">
        <div class="card-title" style="margin-bottom:0">📋 Scheduled Messages</div>
        <span class="refresh-info" id="refresh-info">Auto-refresh: 30s</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Session</th>
            <th>Chat ID</th>
            <th>Type</th>
            <th>Scheduled At</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="msgTable">
          <tr><td colspan="7" class="empty">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let apiKey = '';

    async function loadApiKey() {
      try {
        const r = await fetch('/api/dashboard/config');
        const d = await r.json();
        apiKey = d.apiKey || '';
      } catch {}
    }

    function headers() {
      return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` };
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => t.className = 'toast', 3000);
    }

    function statusBadge(s) {
      const cls = { pending: 'badge-pending', sent: 'badge-sent', failed: 'badge-failed', cancelled: 'badge-cancelled' }[s] || 'badge-pending';
      return `<span class="badge ${cls}">${s}</span>`;
    }

    function fmtDate(ts) {
      return new Date(ts).toLocaleString();
    }

    async function loadMessages() {
      try {
        const r = await fetch('/api/schedule', { headers: { 'Authorization': `Bearer ${apiKey}` } });
        const msgs = await r.json();
        const tbody = document.getElementById('msgTable');
        if (!Array.isArray(msgs) || msgs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="empty">No scheduled messages</td></tr>';
          return;
        }
        tbody.innerHTML = msgs.map(m => `
          <tr>
            <td class="mono">${m.id}</td>
            <td>${m.session}</td>
            <td class="mono">${m.chatId}</td>
            <td>${m.type}</td>
            <td>${fmtDate(m.scheduledAt)}</td>
            <td>${statusBadge(m.status)}</td>
            <td>${m.status === 'pending' ? `<button class="btn btn-danger" onclick="cancelMsg('${m.id}')">Cancel</button>` : '—'}</td>
          </tr>
        `).join('');
      } catch (e) {
        document.getElementById('msgTable').innerHTML = '<tr><td colspan="7" class="empty">Error loading messages</td></tr>';
      }
    }

    async function cancelMsg(id) {
      if (!confirm('Cancel this scheduled message?')) return;
      try {
        await fetch(`/api/schedule/${id}`, { method: 'DELETE', headers: headers() });
        showToast('Message cancelled');
        loadMessages();
      } catch { showToast('Failed to cancel', true); }
    }

    document.getElementById('scheduleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      let payload;
      try { payload = JSON.parse(document.getElementById('f-payload').value); }
      catch { showToast('Invalid JSON payload', true); return; }

      const body = {
        session: document.getElementById('f-session').value.trim(),
        chatId: document.getElementById('f-chatId').value.trim(),
        type: document.getElementById('f-type').value,
        payload,
        scheduledAt: new Date(document.getElementById('f-scheduledAt').value).toISOString(),
      };

      try {
        const r = await fetch('/api/schedule', { method: 'POST', headers: headers(), body: JSON.stringify(body) });
        if (r.ok) { showToast('Message scheduled!'); loadMessages(); }
        else { const d = await r.json(); showToast(d.message || 'Failed', true); }
      } catch { showToast('Error scheduling message', true); }
    });

    // Set default scheduledAt to 5 minutes from now
    const soon = new Date(Date.now() + 5 * 60000);
    soon.setSeconds(0, 0);
    document.getElementById('f-scheduledAt').value = soon.toISOString().slice(0, 16);

    loadApiKey().then(() => {
      loadMessages();
      setInterval(loadMessages, 30000);
    });
  </script>
</body>
</html>
