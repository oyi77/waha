<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAHA — Login</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #080c0a;
      color: #e2e8e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Subtle background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(34,197,94,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,197,94,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Glow blob */
    .glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34,197,94,0.08) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 20px;
      background: #0d1610;
      border: 1px solid #1e2d20;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(34,197,94,0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
      justify-content: center;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-name {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.05em;
      color: #e2e8e0;
    }

    .brand-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(34,197,94,0.15);
      color: #4ade80;
      border: 1px solid rgba(34,197,94,0.2);
      text-transform: uppercase;
    }

    .login-title {
      text-align: center;
      font-size: 15px;
      color: #6b7868;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #6b7868;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      background: #080c0a;
      border: 1px solid #1e2d20;
      border-radius: 8px;
      color: #e2e8e0;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    input:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.1);
    }

    input::placeholder { color: #3d4f3d; }

    .btn-login {
      width: 100%;
      margin-top: 24px;
      padding: 11px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #080c0a;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.02em;
    }

    .btn-login:hover { opacity: 0.9; }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(248,113,113,0.08);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: 8px;
      color: #f87171;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(8,12,10,0.3);
      border-top-color: #080c0a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: #3d4f3d;
    }

    .footer a {
      color: #4ade80;
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="glow"></div>

  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#080c0a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <span class="brand-name">WAHA</span>
      <span class="brand-badge">Plus</span>
    </div>

    <p class="login-title" id="loginTitle">Sign in to your dashboard</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username" id="lblUser">Username</label>
        <input
          id="username"
          type="text"
          placeholder="waha"
          autocomplete="username"
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="password" id="lblPass">Password</label>
        <input
          id="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
    </form>

    <div class="error-msg" id="errorMsg"></div>

    <div class="footer">
      Set via <code>WAHA_DASHBOARD_USERNAME</code> &amp; <code>WAHA_DASHBOARD_PASSWORD</code>
    </div>
  </div>

  <script>
    // Auto-detect language from the browser; ID gets a translated login.
    (function () {
      var lang = (navigator.language || 'en').toLowerCase();
      if (lang.indexOf('id') !== 0) return;
      var el = document.getElementById('loginTitle');
      if (el) el.textContent = 'Masuk ke dasbor Anda';
      var u = document.getElementById('lblUser');
      if (u) u.textContent = 'Nama Pengguna';
      var p = document.getElementById('lblPass');
      if (p) p.textContent = 'Kata Sandi';
      var b = document.getElementById('loginBtn');
      if (b) b.textContent = 'Masuk';
    })();

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorMsg = document.getElementById('errorMsg');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError((navigator.language || 'en').toLowerCase().indexOf('id') === 0
          ? 'Silakan masukkan nama pengguna dan kata sandi.'
          : 'Please enter username and password.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in...';
      errorMsg.style.display = 'none';

      try {
        const resp = await fetch('/api/dashboard/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'same-origin',
        });

        if (resp.ok) {
          // Success — redirect to dashboard
          const redirect = new URLSearchParams(window.location.search).get('from') || '/dashboard';
          window.location.href = redirect;
        } else {
          const data = await resp.json().catch(() => ({}));
          showError(data.error || ((navigator.language || 'en').toLowerCase().indexOf('id') === 0 ? 'Nama pengguna atau kata sandi salah.' : 'Invalid username or password.'));
        }
      } catch {
        showError((navigator.language || 'en').toLowerCase().indexOf('id') === 0 ? 'Koneksi gagal. Apakah WAHA berjalan?' : 'Connection error. Is WAHA running?');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    // Submit on Enter anywhere in the form
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const form = document.getElementById('loginForm');
        if (form) form.requestSubmit();
      }
    });
  </script>
</body>
</html>
